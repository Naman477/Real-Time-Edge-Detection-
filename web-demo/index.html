<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Real-time edge detection using OpenCV.js - Process your camera feed with Canny edge detection directly in the browser.">
    <meta name="theme-color" content="#0a0a0f">
    <title>EdgeVision | Real-Time Edge Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="icon">⚡</span>
                <h1>Edge<span class="highlight">Vision</span></h1>
            </div>
            <div class="actions">
                <a href="https://github.com/Naman477/Real-Time-Edge-Detection-" target="_blank" class="github-link">View
                    on GitHub</a>
            </div>
        </header>

        <main class="main-content">
            <div class="video-wrapper">
                <div class="video-container">
                    <canvas id="outputCanvas"></canvas>
                    <div id="loadingOverlay" class="loading-overlay">
                        <div class="spinner"></div>
                        <p>Initializing OpenCV...</p>
                    </div>
                    <div id="startPrompt" class="start-prompt">
                        <button id="startBtn" class="primary-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                            </svg>
                            Start Camera
                        </button>
                    </div>
                </div>
            </div>

            <aside class="controls-panel">
                <div class="panel-section">
                    <h3>Controls</h3>
                    <div class="control-group">
                        <label for="threshold1">Threshold 1 <span id="val1">50</span></label>
                        <input type="range" id="threshold1" min="0" max="255" value="50">
                    </div>
                    <div class="control-group">
                        <label for="threshold2">Threshold 2 <span id="val2">100</span></label>
                        <input type="range" id="threshold2" min="0" max="255" value="100">
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Actions</h3>
                    <div class="button-group">
                        <button id="screenshotBtn" class="secondary-btn" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                </path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            Take Screenshot
                        </button>
                        <button id="stopBtn" class="danger-btn" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                            Stop
                        </button>
                    </div>
                </div>

                <div class="panel-info">
                    <p>Adjust thresholds to fine-tune edge detection sensitivity in real-time.</p>
                </div>
            </aside>
        </main>
    </div>

    <video id="videoInput" playsinline style="display:none;"></video>

    <script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="onOpenCvReady();"></script>
    <script src="viewer.js"></script>
</body>

</html>
